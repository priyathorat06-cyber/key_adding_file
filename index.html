<div style="text-align:center; padding:30px; font-family:Arial; background:#f4f6f9; border-radius:10px; width:300px; margin:auto; box-shadow:0 4px 10px rgba(0,0,0,0.1);">

  <h2 style="color:#333;">Welcome to My Project</h2>
  <p style="color:#666;">AWS + GitHub Integration Demo</p>

  <input id="nameInput" type="text" placeholder="Enter your name" 
         style="padding:10px; width:80%; border-radius:5px; border:1px solid #ccc; margin:10px 0;">

  <br>

  <button onclick="showMessage()" 
          style="padding:10px 20px; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer;">
    Click Me
  </button>

  <br><br>

  <a href="https://github.com" target="_blank" 
     style="text-decoration:none; color:#007bff; font-weight:bold;">
    Visit GitHub
  </a>

  <br><br>

  <img src="https://via.placeholder.com/200" alt="Sample Image" 
       style="border-radius:10px;">

  <br><br>

  <div style="border:1px solid #ddd; padding:10px; border-radius:8px; background:white;">
    <h3 style="margin:5px 0;">Project</h3>
    <p style="color:#555;">Virtual Campus Tour</p>
  </div>

</div>

<script>
function showMessage() {
  let name = document.getElementById("nameInput").value;
  if(name === "") {
    alert("Please enter your name!");
  } else {
    alert("Welcome " + name + "!");
  }
}
</script>
